name: Full PDK Verification

on:
  workflow_dispatch:
  push:
    branches:
      - "work/complete-isscc27-submission-*"

jobs:
  dense-and-mismatch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PDK_ROOT: /home/runner/pdk
    defaults:
      run:
        working-directory: ISSCC27/submitted_notebooks/ptat_temp_sensor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ngspice and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ngspice
          python -m pip install -r requirements.txt
      - name: Install pinned SKY130 PDK
        uses: TinyTapeout/volare-action@v2
        with:
          pdk_name: sky130
          pdk_version: 12df12e2e74145e31c5a13de02f9a1e176b56e67
          pdk_root: /home/runner/pdk
      - name: Dense TT/FF/SS characterization
        run: |
          python run_sky130.py --mode both --corners tt ff ss --temps=-40:125:5
          python dense_characterization.py
      - name: Local mismatch Monte Carlo
        run: python mismatch_mc.py --samples 100 --temps=-40:125:5
      - name: Archive generated evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isscc27-full-pdk-verification
          path: |
            ISSCC27/submitted_notebooks/ptat_temp_sensor/results/dense_pdk
            ISSCC27/submitted_notebooks/ptat_temp_sensor/results/dense_pdk_analysis.json
            ISSCC27/submitted_notebooks/ptat_temp_sensor/results/mismatch_mc
